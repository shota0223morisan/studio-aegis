<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
    <title>Studio Aegis — 接続先の設定</title>
    <link rel="stylesheet" href="page.css" />
  </head>
  <body>
    <form class="box" id="form">
      <h1>Studio Aegis</h1>
      <p>接続先(Cloudflare にデプロイしたアプリの URL)を入力してください。</p>
      <input id="url" type="url" placeholder="https://studio-aegis.xxxx.workers.dev" required autofocus />
      <div class="row">
        <button class="primary" type="submit">接続</button>
        <button type="button" id="reset">初期値に戻す</button>
      </div>
      <p class="error" id="error"></p>
    </form>
    <script>
      const input = document.getElementById("url");
      const error = document.getElementById("error");
      window.aegisDesktop.getConfig().then((cfg) => {
        input.value = new URLSearchParams(location.search).get("url") || cfg.serverUrl || cfg.defaultServerUrl;
        document.getElementById("reset").onclick = () => (input.value = cfg.defaultServerUrl);
      });
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        error.textContent = "";
        const res = await window.aegisDesktop.setServerUrl(input.value);
        if (!res.ok) error.textContent = res.error;
      };
    </script>
  </body>
</html>
