services:
  studio-aegis:
    build: .
    container_name: studio-aegis
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # 127.0.0.1 のみに公開。他デバイスからは Tailscale serve 等の HTTPS 経由でアクセスする想定
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    volumes:
      - ./data:/data
