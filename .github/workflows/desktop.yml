name: Desktop app (macOS)

# Builds the Session Partner (formerly Studio Aegis) Mac app (web UI bundled in) on a macOS runner and publishes the .dmg
# as a GitHub Release
# (tag desktop-v<version from desktop/package.json>).
on:
  push:
    branches: [main, claude/modest-mccarthy-l26qtf]
    paths: ["desktop/**", "web/**", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build web UI
        working-directory: .
        run: npm ci && npm run build

      - run: npm ci

      - name: Build app bundles (Apple Silicon + Intel)
        run: npx electron-builder --mac dir --arm64 --x64 --publish never

      # No Apple Developer ID: sign ad-hoc so the app launches on Apple Silicon
      # (users approve it once in System Settings → Privacy & Security).
      - name: Ad-hoc sign and package DMGs
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -maxdepth 2 -name "Session Partner.app" -print0 | while IFS= read -r -d '' app; do
            exe="$app/Contents/MacOS/Session Partner"
            case "$(lipo -archs "$exe")" in
              arm64) arch=apple-silicon ;;
              x86_64) arch=intel ;;
              *) echo "unexpected arch for $app"; exit 1 ;;
            esac
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            stage="$(mktemp -d)"
            cp -R "$app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Session Partner" -srcfolder "$stage" -ov -format UDZO "out/Studio-Aegis-${arch}.dmg"
            # .zip for the in-app updater (ditto keeps the bundle's links and signature intact). Inside, the
            # folder keeps the old "Studio Aegis.app" name so versions before the rename can still update;
            # the app renames its own bundle on first launch.
            zstage="$(mktemp -d)"
            ditto "$app" "$zstage/Studio Aegis.app"
            ditto -c -k --sequesterRsrc --keepParent "$zstage/Studio Aegis.app" "out/Studio-Aegis-${arch}.zip"
          done
          ls -la out
          test "$(ls out/*.dmg | wc -l)" -eq 2
          test "$(ls out/*.zip | wc -l)" -eq 2

      # Same checks the in-app updater runs before swapping the app.
      - name: Verify updater zips
        run: |
          set -euo pipefail
          want="$(node -p "require('./package.json').version")"
          for zip in out/*.zip; do
            dir="$(mktemp -d)"
            ditto -x -k "$zip" "$dir"
            plist="$dir/Studio Aegis.app/Contents/Info.plist"
            test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "dev.studioaegis.desktop"
            test "$(plutil -extract CFBundleShortVersionString raw -o - "$plist")" = "$want"
            codesign --verify --deep --strict "$dir/Studio Aegis.app"
            echo "ok: $zip"
          done

      # Launch the real app once and make sure it stays up and serves its UI (catches crash-on-launch,
      # e.g. an Info.plist name that doesn't match the helper apps).
      # Launch the real app and make sure it stays up and serves its UI (catches crash-on-launch, e.g.
      # an Info.plist name that doesn't match the helper apps). Also checks the update path: an install
      # still named "Studio Aegis.app" renames itself to "Session Partner.app" and relaunches.
      - name: Launch smoke test
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          ditto -x -k out/Studio-Aegis-apple-silicon.zip "$dir"
          plist="$dir/Studio Aegis.app/Contents/Info.plist"
          name="$(plutil -extract CFBundleName raw -o - "$plist")"
          exe="$(plutil -extract CFBundleExecutable raw -o - "$plist")"
          test "$name" = "Session Partner"
          test -d "$dir/Studio Aegis.app/Contents/Frameworks/$name Helper.app" || { echo "no helper app for CFBundleName '$name'"; exit 1; }
          "$dir/Studio Aegis.app/Contents/MacOS/$exe" > launch.log 2>&1 &
          ok=""
          for i in $(seq 1 40); do
            sleep 1
            if [ -d "$dir/Session Partner.app" ] && curl -sf -o /dev/null http://127.0.0.1:47823/; then ok=1; break; fi
          done
          test -d "$dir/Session Partner.app" || { echo "bundle was not renamed"; ls "$dir"; cat launch.log; exit 1; }
          test -n "$ok" || { echo "UI never came up after the rename"; cat launch.log; exit 1; }
          sleep 5
          curl -sf -o /dev/null http://127.0.0.1:47823/ || { echo "app died after launch"; cat launch.log; exit 1; }
          pkill -f "Session Partner.app/Contents/MacOS" || true
          echo "launch ok"

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: studio-aegis-mac
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Session Partner for Mac ${{ steps.version.outputs.version }}
          files: |
            desktop/out/*.dmg
            desktop/out/*.zip
          overwrite_files: true
          body: |
            ## ダウンロード
            - **Apple Silicon(M1 / M2 / M3 / M4 …)** → `Studio-Aegis-apple-silicon.dmg`
            - **Intel Mac** → `Studio-Aegis-intel.dmg`
            (どちらか分からないときは  メニュー →「この Mac について」の「チップ」を確認)

            ## インストール / 更新
            1. dmg を開き、Session Partner を「アプリケーション」へドラッグ(前の Studio Aegis は削除して OK。データはそのまま)
            2. 初回だけ: アプリを開こうとすると「開けません」と出るので、
               **システム設定 → プライバシーとセキュリティ** の下の方にある「このまま開く」をクリック
               (Apple の有料開発者署名をしていない個人用アプリのため)

            v0.6.0 以降は、アプリ内の「今すぐ更新」ボタンで自動更新できます(.zip はそのためのファイルです)。
            データ(取引先・曲・メモ・音源)は Mac 内に保存されていて、更新しても消えません。
